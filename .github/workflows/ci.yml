name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows has no process-watching backend yet (see README, Limitations).
        os: [ubuntu-latest, macos-latest]
        node: ['22.12.0', 22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      # The packed package must install from an empty directory and capture a real request.
      - name: pack smoke test
        run: |
          npm pack
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm i "$GITHUB_WORKSPACE"/whatleaks-*.tgz
          npx whatleaks --version
          npx whatleaks run -o "$RUNNER_TEMP/smoke.har" -- node -e "fetch('https://example.com/?from=ci').then((r) => r.text())"
          grep -q 'from=ci' "$RUNNER_TEMP/smoke.har"
