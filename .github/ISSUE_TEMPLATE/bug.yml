name: Bug report
description: whatleaks crashed, missed something, or reported something wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: "whatleaks run -- npm run build"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: whatleaks's output or report. Read it before posting; never attach the HAR file.
      render: text
  - type: input
    id: env
    attributes:
      label: whatleaks version, OS and Node version
      placeholder: "whatleaks 0.1.0, Ubuntu 24.04, Node 24.11.0"
    validations:
      required: true
